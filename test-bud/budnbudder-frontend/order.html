<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders | Bud n' Budder — Astoria, NY</title>
<meta name="description" content="View your past orders at Bud n' Budder, Astoria, NY.">
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/partials/header.css">
<link rel="stylesheet" href="assets/css/partials/footer.css">
<link rel="stylesheet" href="assets/css/order.css">
<link rel="stylesheet" href="assets/css/customer-payment-status.css">
</head>
<body>

<div id="siteHeaderInclude"></div>

<main>

  <!-- ============================= -->
  <!-- PAGE HEAD -->
  <!-- ============================= -->
  <section class="orders-pagehead">
    <div class="container">
      <nav class="orders-breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span class="orders-breadcrumb__sep">&gt;</span>
        <span class="orders-breadcrumb__current">My Orders</span>
      </nav>
      <h1 class="orders-pagehead__title">My Orders</h1>
      <p class="orders-pagehead__sub">A record of everything you've ordered from us.</p>
    </div>
  </section>

  <!-- ============================= -->
  <!-- NO ORDERS YET -->
  <!-- ============================= -->
  <section class="container orders-empty" id="ordersEmpty" hidden>
    <div class="orders-empty__icon">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none"><path d="M4 7H20V19C20 20.1 19.1 21 18 21H6C4.9 21 4 20.1 4 19V7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M4 7L6 3H18L20 7" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 11C9 12.7 10.3 14 12 14C13.7 14 15 12.7 15 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
    <h3>No orders yet</h3>
    <p>Once you place an order, it'll show up here.</p>
    <a href="shop.html" class="btn btn--primary">Start Shopping</a>
  </section>

  <!-- ============================= -->
  <!-- ORDERS LIST -->
  <!-- ============================= -->
  <section class="container orders-section" id="ordersSection" hidden>
    <div class="orders-list" id="ordersList">
      <!-- order cards injected by order.js -->
    </div>
  </section>

</main>

<div id="siteFooterInclude"></div>

<script src="assets/js/include.js"></script>
<script src="assets/js/partials/header.js"></script>
<script src="assets/js/partials/footer.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/order.js"></script>
</body>
</html>
