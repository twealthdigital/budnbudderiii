<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
</head>
<body>

<!-- ============================= -->
<!-- HEADER / NAV -->
<!-- ============================= -->
<header class="site-header" id="siteHeader">
  <div class="site-header__inner">

    <a href="#" class="brand">
      <span class="logo-frame" aria-label="Bud n' Budder logo — replace with brand logo">
        <img src="assets/images/logo.png" alt="Bud n' Budder logo">
      </span>
    </a>

    <nav class="main-nav" id="mainNav">
      <a href="#" class="main-nav__link">Home</a>
      <div class="main-nav__dropdown">
        <a href="shop.html" class="main-nav__link">Shop
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <div class="main-nav__dropdown-menu">
          <a href="#featured" data-cat="flower">Flower</a>
          <a href="#featured" data-cat="prerolls">Pre-Rolls</a>
          <a href="#featured" data-cat="edibles">Edibles</a>
          <a href="#featured" data-cat="vapes">Vapes</a>
        </div>
      </div>
      <a href="about.html" class="main-nav__link">About</a>
      <a href="about.html#contact-form" class="main-nav__link">Contact</a>
    </nav>

    <div class="header-icons">
      <button class="icon-btn" id="searchToggle" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.7"/><path d="M21 21L16.6 16.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
<div class="account-dropdown" id="accountDropdown">
  <button type="button" class="icon-btn" id="accountToggle" aria-haspopup="true" aria-expanded="false" aria-label="Account">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.5"/><path d="M5 20C5 16.5 8 14.5 12 14.5C16 14.5 19 16.5 19 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
  </button>

  <div class="account-dropdown__menu" id="accountMenu">
    <!-- logged OUT state -->
    <a href="auth.html?mode=signin" class="account-dropdown__item" data-account="signin">Sign In</a>
    <a href="auth.html?mode=signup" class="account-dropdown__item" data-account="signup">Sign Up</a>

    <!-- logged IN state (hidden until header.js says otherwise) -->
    <span class="account-dropdown__user" data-account="username" hidden></span>
    <a href="order.html" class="account-dropdown__item" data-account="orders" hidden>Orders</a>
    <button type="button" class="account-dropdown__item" data-account="logout" hidden>Logout</button>
  </div>
</div>
      <button class="icon-btn icon-btn--cart" id="cartToggle" aria-label="Cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6H5L6.3 15.6C6.4 16.6 7.3 17.3 8.3 17.3H17.4C18.4 17.3 19.2 16.6 19.4 15.7L20.9 8.6C21.1 7.9 20.5 7.2 19.8 7.2H5.6" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="9" cy="21" r="1.3" fill="currentColor"/><circle cx="17" cy="21" r="1.3" fill="currentColor"/></svg>
        <span class="cart-badge" id="cartBadge">0</span>
      </button>
      <button class="icon-btn icon-btn--burger" id="burgerToggle" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 6H21M3 12H21M3 18H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="#">Home</a>
    <a href="shop.html">Shop</a>
    <a href="about.html">About</a>
    <a href="about.html#contact-form">Contact</a>

    <div class="mobile-account" id="mobileAccount">
      <button type="button" class="mobile-account__toggle" id="mobileAccountToggle" aria-haspopup="true" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.5"/><path d="M5 20C5 16.5 8 14.5 12 14.5C16 14.5 19 16.5 19 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Account
        <svg class="mobile-account__chevron" width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="mobile-account__menu" id="mobileAccountMenu">
        <a href="auth.html?mode=signin" data-account="mobile-signin">Sign In</a>
        <a href="auth.html?mode=signup" data-account="mobile-signup">Sign Up</a>
        <span class="mobile-account__user" data-account="mobile-username" hidden></span>
        <a href="order.html" data-account="mobile-orders" hidden>Orders</a>
        <button type="button" data-account="mobile-logout" hidden>Logout</button>
      </div>
    </div>
  </div>
</header>

<!-- ============================= -->
<!-- SEARCH OVERLAY -->
<!-- ============================= -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-overlay__box">
    <div class="search-overlay__top">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.7"/><path d="M21 21L16.6 16.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <input type="text" id="searchInput" placeholder="Search products…" autocomplete="off">
      <button class="search-overlay__close" id="searchClose" aria-label="Close search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="search-overlay__results" id="searchResults">
      <p class="search-overlay__hint">Try "flower", "gummies", or "vape"</p>
    </div>
  </div>
</div>

<!-- ============================= -->
<!-- CART DRAWER -->
<!-- ============================= -->
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer__head">
    <h3>Your Cart</h3>
    <button id="cartClose" aria-label="Close cart">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="cart-drawer__items" id="cartItems"></div>
  <div class="cart-drawer__footer">
    <div class="cart-drawer__subtotal">
      <span>Subtotal</span>
      <span id="cartSubtotal">$0.00</span>
    </div>
    <button class="btn btn--primary btn--block" id="checkoutBtn">Checkout</button>
  </div>
</div>
<div class="overlay-scrim" id="overlayScrim"></div>
</body>
</html>
